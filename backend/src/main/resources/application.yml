# Overlord Monitoring — Backend-Konfiguration
#
# In dieser Datei stehen KEINE Zugangsdaten. Alles Umgebungsspezifische kommt
# ueber Umgebungsvariablen; die Vorlage dafuer ist backend/.env.example.
#
# Profile:
#   dev   lokale Entwicklung — Standard, wenn nichts gesetzt ist
#   prod  Betrieb — muss ueber SPRING_PROFILES_ACTIVE=prod aktiviert werden

spring:
  application:
    name: overlord-monitor
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  # Die beiden DSLContexts werden von Hand gebaut (config/JooqConfig). Boots
  # jOOQ-Autokonfiguration wuerde einen ConnectionProvider aus genau einer
  # DataSource ableiten wollen und an den zwei bewusst nicht-primaeren DataSources
  # scheitern. Sie wird deshalb abgeschaltet.
  autoconfigure:
    exclude:
      - org.springframework.boot.jooq.autoconfigure.JooqAutoConfiguration
      # Ohne diese Ausnahme legt Boot beim Start einen Standardnutzer mit erzeugtem
      # Passwort an und schreibt es ins Protokoll. Dieses Projekt hat eine eigene
      # Benutzerverwaltung; ein zweiter, unbeabsichtigter Weg hinein waere genau der
      # Codepfad, den niemand prueft.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Die Sitzung liegt serverseitig in overlord_monitor (Spring Session JDBC), gebunden
  # ueber @SpringSessionDataSource an den Schreib-Pool. Das Schema legt Flyway an
  # (V3__spring_session.sql) — "never" verhindert, dass Spring Session an Flyway vorbei
  # arbeitet und ein zweites, leicht abweichendes Schema erzeugt.
  session:
    jdbc:
      initialize-schema: never
  # Flyway verwaltet AUSSCHLIESSLICH overlord_monitor (Regel S2). Gebunden wird der
  # Schreib-Pool ueber @FlywayDataSource (config/DataSourceConfig). Das Schema
  # existiert bereits, wird also nicht angelegt und nicht baselined.
  flyway:
    enabled: true
    default-schema: ${OVERLORD_DB_MONITOR_SCHEMA}
    schemas: ${OVERLORD_DB_MONITOR_SCHEMA}
    create-schemas: false
    baseline-on-migrate: false

# Verbindungsangaben beider Schemata. Ausschliesslich Umgebungsvariablen — die
# JDBC-URL wird im Code gebaut und traegt bewusst keine Zeitzonenparameter.
overlord:
  db:
    host: ${OVERLORD_DB_HOST}
    port: ${OVERLORD_DB_PORT}
    glassfish-schema: ${OVERLORD_DB_GLASSFISH_SCHEMA}
    monitor-schema: ${OVERLORD_DB_MONITOR_SCHEMA}
    read-user: ${OVERLORD_DB_READ_USER}
    read-password: ${OVERLORD_DB_READ_PASSWORD}
    write-user: ${OVERLORD_DB_WRITE_USER}
    write-password: ${OVERLORD_DB_WRITE_PASSWORD}
  # Grenzen des Rohdatenzugriffs (Schritt 8). Jede Zahl hat eine gemessene
  # Bemessungsgrundlage, keinen geratenen Rundwert — Begruendung an
  # payload/RohdatenEigenschaften.
  #
  # Sie stehen hier und nicht nur als Vorgabe im Code, damit im Betrieb sichtbar
  # ist, was gilt, ohne dass jemand eine Klasse aufschlagen muss. Es sind keine
  # Zugangsdaten; sie duerfen deshalb in der versionierten Datei stehen.
  rohdaten:
    # Harte Obergrenze einer einzelnen Datei. Groesstes gemessenes Artefakt:
    # 609.995 Byte, keines ueber 1 MiB (M60). 8 MiB liegen gut dreizehnfach
    # darueber. Sie greift WAEHREND des Lesens — die Vorabgroesse aus der
    # Datenbank deckt nur 69,6 % der Artefakte und taugt nicht dafuer.
    maximalgroesse-bytes: 8388608
    # Ab wann die Anzeige gekappt wird, mit sichtbarem Hinweis. Der Download
    # bleibt vollstaendig. 1 MiB liegt ueber dem gemessenen Maximum.
    anzeige-grenze-bytes: 1048576
    verbindungszeitgrenze: 5s
    # Gemessen sind 38 bis 244 ms je Abruf (M66, M60), langsamster Einzelabruf
    # 497 ms (M71). 15s fangen den Knoten ab, der annimmt und dann schweigt.
    lesezeitgrenze: 15s
  # Der Rollup-Job (Schritt 10a). Er schreibt message_rollup fort; das Dashboard
  # in 10b liest ausschliesslich daraus (Leistungsregel L2).
  #
  # ZWEI RIEGEL, und beide sind Absicht:
  #   1. das Profil "rollup" -- ohne es gibt es RollupPlaner gar nicht. Im Betrieb
  #      laeuft der Job damit als eigener Prozess derselben Anwendung
  #      (SPRING_PROFILES_ACTIVE=prod,rollup), ohne eigenes Artefakt und ohne
  #      eigenes Wurzelpaket (PROJEKTBESCHREIBUNG.md §6).
  #   2. "aktiv" -- damit laesst er sich abschalten, ohne das Profil zu aendern.
  #      Fehlt der Schluessel, ist die Ausloesung AUS.
  rollup:
    aktiv: true
    # Stuendlich, kurz NACH der vollen Stunde. Die Minute ist nicht gemessen und
    # auch folgenlos: Jeder Lauf ersetzt ganze Stundeneimer und greift 15 Minuten
    # zurueck, die zuletzt geschriebene Stunde wird also ohnehin neu gerechnet.
    # Der Abstand haelt den Job nur aus dem Gedraenge der Jobs heraus, die zur
    # vollen Stunde starten.
    delta-plan: "0 5 * * * *"
    # Naechtlich. DIE UHRZEIT IST UNGEMESSEN (Regel Q4): Die Verteilung von
    # MessageLastUpdate ueber die Tagesstunde ist in M86 bis M92 nicht erhoben
    # worden. 03:00 ist die uebliche Wahl und keine hergeleitete; der offene
    # Punkt steht in docs/rollup.md.
    voll-plan: "0 0 3 * * *"
    # Drosselung zwischen zwei Monatsscheiben -- Leistungsregel L6. Sie greift beim
    # Volllauf, der ueber den Bestand der Testkopie 23 Scheiben hat (22 Pausen). Der
    # Delta-Lauf hat in aller Regel genau eine Scheibe und wartet dann nicht; die
    # Ausnahme ist der Monatswechsel, wo der Kalender sein Fenster in zwei schneidet.
    # AUCH DIESER WERT IST UNGEMESSEN: Wie viel Last die Produktionsinstanz nachts
    # vertraegt, ist nicht erhoben. Gemessen ist nur, was er kostet -- 45,772 s ohne
    # Drosselung gegen 69,186 s mit.
    #
    # Ein einmaliger Lauf von Hand laeuft ueber den Startparameter
    #   --overlord.rollup.beim-start=VOLL
    # und ausdruecklich NICHT ueber einen HTTP-Endpunkt.
    scheiben-pause: 1s

  # Die Nachrichtenliste (Schritt 4, erweitert am 30.08.2026).
  nachrichtenliste:
    # Ob die Liste ihr Zeitfenster vorab ueber message_rollup verengt.
    #
    # WAS DAS BRINGT (docs/nachrichtenliste.md §5d, gemessen): Der teuerste
    # bekannte Fall des Projekts -- der Prozessfilter mit verkehrsreichen
    # Prozessen, 7,46 s bei einer 10-s-Grenze des Lese-Pools -- faellt auf
    # unter 7 ms. SUTTONS faellt von 1.043 auf 8,6 ms, EDITIONLINGERI von
    # 2.127 ms auf eine Abfrage, die gar nicht mehr gestellt wird.
    #
    # WARUM ES IHN TROTZDEM GIBT: Das ist die erste Stelle, an der eine
    # KERNabfrage von einer Tabelle abhaengt, die dieses Projekt selbst
    # fortschreibt. Ist der Rollup kaputt, muss die Liste ohne ihn
    # weiterlaufen -- langsamer, aber richtig. Der Schalter ist der letzte
    # der drei Schutzmechanismen; die beiden anderen (Wasserstand und
    # fehlende Untergrenze) greifen von selbst.
    #
    # FEHLT DER SCHLUESSEL, IST DIE VERENGUNG AUS. boolean ohne Eintrag ist
    # false, und das ist die sichere Richtung -- dieselbe Entscheidung wie
    # bei overlord.rollup.aktiv.
    verengung: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      # Sitzungsdauer ohne Aktivitaet. Gerechnet wird mit der Systemuhr, nicht mit der
      # Anwendungsuhr aus Schritt 2 — die ist im dev-Profil um Wochen zurueckversetzt.
      timeout: 30m
      cookie:
        # Eigener Name statt JSESSIONID: Das Cookie gehoert diesem Werkzeug und nicht
        # irgendeinem Servlet-Container. Diese Werte gelten auch fuer Spring Session —
        # Boot baut den CookieSerializer daraus.
        name: OVERLORD_SESSION
        http-only: true
        same-site: lax
        # Standard ist AN. Das dev-Profil schaltet es aus, sonst schickt der Browser das
        # Cookie ueber http://localhost nicht mit und die lokale Entwicklung steht.
        # Ein Test belegt, dass es ausserhalb von dev gesetzt ist.
        secure: true
  # Regel: Niemals interne Details oder Stacktraces an den Client.
  # Gilt in JEDEM Profil — auch in dev, sonst wird es in prod vergessen.
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # Ausschliesslich health. Jeder weitere Endpunkt wird einzeln freigegeben.
        include: health
  endpoint:
    health:
      # Nach aussen nur der Gesamtstatus, in JEDEM Profil. Die Einzelheiten nennen
      # die beiden Datenbankverbindungen — und das dev-Profil zeigt auf die
      # Testkopie, eine Vollkopie der Produktion. Wer mehr sehen will, liest das
      # Protokoll. Im dev-Profil sind die Details freigeschaltet (siehe unten).
      show-details: never
      show-components: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    de.kraftwerkone.overlord.monitor: ${LOG_LEVEL_APP:INFO}

---
# ─── dev ────────────────────────────────────────────────────────────────────
# Lokale Entwicklung gegen die Testkopie (Datenstand 08.07.2026).
# Der TimeProvider liefert hier MAX(Message.MessageLastUpdate) statt der Systemuhr
# — sonst liefert das Standard-Zeitfenster von 24 Stunden null Zeilen.
spring:
  config:
    activate:
      on-profile: dev

overlord:
  rollup:
    # AUS, und zwar ausdruecklich -- nicht nur, weil das Profil "rollup" lokal
    # ohnehin nicht aktiv ist. Wer zum Ausprobieren "dev,rollup" startet, soll
    # trotzdem nicht unaufgefordert in die GETEILTE Testkopie schreiben. Ein Lauf
    # von Hand geht ueber --overlord.rollup.beim-start=DELTA bzw. VOLL; der haengt
    # weder am Profil noch an diesem Schalter, weil er ausdruecklich angefordert
    # worden ist.
    aktiv: false

server:
  servlet:
    session:
      cookie:
        # NUR hier aus. Ueber http://localhost sendet der Browser ein Secure-Cookie nicht
        # mit; ohne diese Schaltbarkeit funktioniert die lokale Entwicklung nicht. In jedem
        # anderen Profil bleibt es an.
        secure: false

management:
  endpoint:
    health:
      # In der Entwicklung beide Verbindungen getrennt sichtbar.
      show-details: always
      show-components: always

logging:
  level:
    de.kraftwerkone.overlord.monitor: ${LOG_LEVEL_APP:DEBUG}

---
# ─── prod ───────────────────────────────────────────────────────────────────
# Betrieb. Gelesen wird zur Laufzeit auf der Produktionsdatenbank —
# die Leistungsregeln L1 bis L6 sind hier nicht verhandelbar.
spring:
  config:
    activate:
      on-profile: prod

server:
  forward-headers-strategy: framework

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    de.kraftwerkone.overlord.monitor: ${LOG_LEVEL_APP:INFO}
