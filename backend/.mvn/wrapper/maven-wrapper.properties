# Maven Wrapper — "only-script"-Variante.
#
# Es liegt bewusst KEINE maven-wrapper.jar im Repository. Die Skripte mvnw und
# mvnw.cmd laden die unten angegebene Maven-Distribution selbst herunter und
# legen sie unter ~/.m2/wrapper/dists ab. Damit enthaelt das Repository keine
# eingecheckte Binaerdatei.
#
# Die Pruefsumme ist gepinnt: Der Wrapper bricht ab, wenn das heruntergeladene
# Archiv nicht exakt dieser SHA-256 entspricht. Sie wurde gegen die von Apache
# veroeffentlichte SHA-512 des Artefakts geprueft.
#
# Maven-Version anheben: distributionUrl aendern UND distributionSha256Sum neu
# berechnen. Niemals nur die URL aendern.

wrapperVersion=3.3.4
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
